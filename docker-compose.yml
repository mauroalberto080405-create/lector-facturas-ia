services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env        # IA_PROVEEDOR, OPENAI_API_KEY, etc. (opcional)
        required: false
    environment:
      # Dentro de Docker "localhost" es el propio contenedor:
      # la base se llama por el nombre del servicio y Ollama vive en tu PC (host).
      DATABASE_URL: postgresql+psycopg://facturas:facturas@db:5432/facturas
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"   # para que también funcione en Linux (CI)
    depends_on:
      db:
        condition: service_healthy   # espera a que PostgreSQL acepte conexiones

  db:
    image: postgres:16-alpine
    environment:
      # Credenciales SOLO para desarrollo local.
      POSTGRES_USER: facturas
      POSTGRES_PASSWORD: facturas
      POSTGRES_DB: facturas
    ports:
      - "5432:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturas -d facturas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos_db:
