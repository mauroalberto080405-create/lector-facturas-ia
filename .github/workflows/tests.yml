name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Los tests no necesitan IA ni PostgreSQL: usan un extractor falso y SQLite en memoria.
      - name: Generar facturas ficticias
        run: python scripts/generar_facturas.py

      - name: Correr tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen de la API
        run: docker compose build api
